<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Favoritos — Elora</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="../../css/style.css" rel="stylesheet">
  <link href="../../css/responsive.css" rel="stylesheet">
</head>
<body class="bg-light">
  <a class="skip-link" href="#main">Pular para o conteúdo</a>
<nav class="navbar navbar-elora sticky-top"><div class="container"><a class="navbar-brand" href="../../../index.html">EL<span>ORA</span></a><a href="#" data-action="dashboard" class="btn btn-elora-outline btn-sm" aria-label="Voltar ao painel"><i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Voltar</a></div></nav>
<div class="container py-4" id="main">
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h4 class="mb-0">Meus favoritos</h4>
    <a href="../busca/buscar-cuidadores.html" class="btn btn-elora-primary btn-sm"><i class="bi bi-search me-1"></i> Buscar cuidadores</a>
  </div>
  <div class="card-elora p-3 mb-3">
    <div class="d-flex gap-2 flex-wrap">
      <input id="search" class="form-control" style="max-width:320px" placeholder="Buscar por nome ou especialidade" aria-label="Buscar favorito">
      <button id="btnSearch" class="btn btn-elora-primary btn-sm text-nowrap">Buscar</button>
    </div>
  </div>
  <div id="favList" class="row g-3"></div>
  <div id="empty" class="text-center text-muted py-5 d-none" role="status" aria-live="polite"><i class="bi bi-heart fs-1"></i><p class="mt-2 mb-3">Você ainda não favoritou nenhum cuidador.</p><a href="../busca/buscar-cuidadores.html" class="btn btn-elora-primary">Buscar cuidadores</a></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../config/config.js"></script>
<script src="../../services/apiService.js"></script>
<script src="../../services/mockData.js"></script>
<script src="../../services/authService.js"></script>
<script src="../../services/notificationService.js"></script>
<script src="../../services/clientService.js"></script>
<script src="../../services/caregiverService.js"></script>
<script src="../../services/contractService.js"></script>
<script src="../../services/paymentService.js"></script>
<script src="../../services/mapsService.js"></script>
<script src="../../services/app.js"></script>
<script>
  let favs = [];
  async function load(){
    if(!authService.isClient()){ window.location.href='../auth/login.html?redirect='+encodeURIComponent('favoritos/lista.html'); return; }
    try{
      favs = await clientService.getFavorites();
      render();
    }catch(err){ notificationService.showError(err.message); }
  }
  function render(){
    const q = (document.getElementById('search').value||'').toLowerCase();
    const list = favs.filter(f=> !q || (f.name||'').toLowerCase().includes(q) || (f.specialties||[]).join(' ').toLowerCase().includes(q));
    document.getElementById('empty').classList.toggle('d-none', list.length>0);
    document.getElementById('favList').innerHTML = list.map(f=>`
      <div class="col-md-6 col-lg-4">
        <div class="card-elora caregiver-card p-3 h-100">
          <div class="d-flex gap-3">
            <div class="avatar-placeholder"><i class="bi bi-person"></i></div>
            <div class="flex-grow-1">
              <div class="d-flex align-items-center gap-2"><strong>${escapeHtml(f.name)}</strong> ${f.verified?'<span class="verified small"><i class="bi bi-patch-check-fill"></i> Verificado</span>':''}</div>
              <div class="small text-muted">${escapeHtml((f.specialties||[]).slice(0,3).join(' • '))}</div>
              <div class="small"><span class="stars">${'★'.repeat(Math.floor(f.rating||0))}${'☆'.repeat(5-Math.floor(f.rating||0))}</span> ${(f.rating||0).toFixed(1)} (${f.reviewCount||0})</div>
              <div class="small text-muted">R$ ${Number(f.hourlyRate||f.precoHora||0).toFixed(2)}/h</div>
            </div>
          </div>
          <div class="d-flex gap-2 mt-3">
            <a href="../busca/perfil-cuidador.html?id=${encodeURIComponent(f.id)}" class="btn btn-elora-primary btn-sm flex-grow-1">Ver perfil</a>
            <a href="../contratos/contratacao.html?caregiverId=${encodeURIComponent(f.id)}" class="btn btn-elora-outline btn-sm">Contratar</a>
            <button class="btn btn-sm btn-outline-danger btn-unfav" data-id="${escapeHtml(f.id)}" aria-label="Remover ${escapeHtml(f.name)} dos favoritos"><i class="bi bi-heart-fill"></i></button>
          </div>
        </div>
      </div>`).join('');
    document.querySelectorAll('.btn-unfav').forEach(b=> b.addEventListener('click', async()=>{
      const ok = await showConfirmModal({ title: 'Remover favorito', message: 'Remover este cuidador dos favoritos?', confirmLabel: 'Remover' });
      if(!ok) return;
      try{ await clientService.removeFavorite(b.dataset.id); notificationService.showSuccess('Removido dos favoritos'); load(); }catch(err){ notificationService.showError(err.message); }
    }));
  }
  document.getElementById('btnSearch')?.addEventListener('click', render);
  document.getElementById('search')?.addEventListener('input', render);
  document.addEventListener('DOMContentLoaded', load);
</script>
</body>
</html>
