<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contratação — Elora</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="../../css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-elora"><div class="container"><a class="navbar-brand" href="../../../index.html">EL<span>ORA</span></a><a href="../busca/buscar-cuidadores.html" class="btn btn-elora-outline btn-sm">Cancelar</a></div></nav>
<div class="container py-5">
  <div class="row justify-content-center"><div class="col-lg-8">
    <div class="stepper mb-4"><span class="step active">1</span><span class="step-line"></span><span class="step">2</span><span class="step-line"></span><span class="step">3</span></div>
    <div class="card-elora p-4 p-md-5">
      <h2 class="section-title">Nova contratação</h2>
      <p class="small text-muted" id="caregiverInfo">Carregando cuidador...</p>
      <form id="formContratacao" novalidate>
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label">Data início *</label><input type="date" class="form-control" name="startDate" required></div>
          <div class="col-md-6"><label class="form-label">Data fim *</label><input type="date" class="form-control" name="endDate" required></div>
          <div class="col-12"><label class="form-label">Dias da semana *</label>
            <div class="d-flex gap-2 flex-wrap">
              <label class="form-check"><input type="checkbox" value="1" class="form-check-input day"> Seg</label>
              <label class="form-check"><input type="checkbox" value="2" class="form-check-input day"> Ter</label>
              <label class="form-check"><input type="checkbox" value="3" class="form-check-input day"> Qua</label>
              <label class="form-check"><input type="checkbox" value="4" class="form-check-input day"> Qui</label>
              <label class="form-check"><input type="checkbox" value="5" class="form-check-input day"> Sex</label>
              <label class="form-check"><input type="checkbox" value="6" class="form-check-input day"> Sáb</label>
              <label class="form-check"><input type="checkbox" value="0" class="form-check-input day"> Dom</label>
            </div>
          </div>
          <div class="col-md-3"><label class="form-label">Início</label><input type="time" class="form-control" name="scheduleStart" value="08:00" required></div>
          <div class="col-md-3"><label class="form-label">Fim</label><input type="time" class="form-control" name="scheduleEnd" value="17:00" required></div>
          <div class="col-md-3"><label class="form-label">Valor/hora (R$)</label><input type="number" step="0.01" class="form-control" name="hourlyRate" id="hourlyRate" required></div>
          <div class="col-md-3"><label class="form-label">Pagamento</label><select class="form-select" name="paymentMethod"><option value="PIX">PIX</option><option value="CARD">Cartão</option><option value="BOLETO">Boleto</option></select></div>
          <div class="col-12"><label class="form-label">Atividades / observações</label><textarea class="form-control" name="activitiesText" rows="3" placeholder="Ex: Higiene, medicação, alimentação...">Higiene pessoal, medicação, alimentação, companhia</textarea></div>
          <div class="col-12">
            <div class="bg-light p-3 rounded">
              <h6>Resumo</h6>
              <div id="summary" class="small text-muted">Preencha as datas e horários para calcular.</div>
            </div>
          </div>
        </div>
        <div id="formAlert" class="alert d-none mt-3"></div>
        <button type="submit" class="btn btn-elora-primary btn-lg w-100 mt-3">Criar contrato (rascunho)</button>
        <p class="small text-muted text-center mt-2">Você será redirecionado para assinatura digital.</p>
      </form>
    </div>
  </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../config/config.js"></script>
<script src="../../services/apiService.js"></script>
<script src="../../services/mockData.js"></script>
<script src="../../services/authService.js"></script>
<script src="../../services/notificationService.js"></script>
<script src="../../services/clientService.js"></script>
<script src="../../services/caregiverService.js"></script>
<script src="../../services/contractService.js"></script>
<script src="../../services/paymentService.js"></script>
<script src="../../services/mapsService.js"></script>
<script src="../../services/app.js"></script>
<script>
  const cgId = new URLSearchParams(window.location.search).get('caregiverId');
  let caregiver=null;
  async function init(){
    if(!authService.isClient()){ notificationService.showWarning('Entre como cliente para contratar'); window.location.href='login.html?redirect=contratacao.html?caregiverId='+cgId; return; }
    if(!cgId){ document.getElementById('caregiverInfo').textContent='Cuidador não informado'; return; }
    try{ caregiver = await caregiverService.getCaregiver(cgId); document.getElementById('caregiverInfo').innerHTML=`<strong>${caregiver.name}</strong> • R$ ${Number(caregiver.hourlyRate).toFixed(2)}/h • ${caregiver.verified?'<span class="verified">Verificado</span>':''}`; document.getElementById('hourlyRate').value=caregiver.hourlyRate; updateSummary(); }catch(err){ document.getElementById('caregiverInfo').textContent=err.message; }
  }
  function calcHours(s,e){ const [sh,sm]=s.split(':').map(Number); const [eh,em]=e.split(':').map(Number); return (eh*60+em - (sh*60+sm))/60; }
  function updateSummary(){
    const fd=new FormData(document.getElementById('formContratacao'));
    const start=fd.get('startDate'), end=fd.get('endDate'), s=fd.get('scheduleStart'), e=fd.get('scheduleEnd');
    const rate=parseFloat(fd.get('hourlyRate'))||0;
    const days=[...document.querySelectorAll('.day:checked')].map(x=>parseInt(x.value));
    if(!start||!end||!s||!e||!days.length||!rate){ document.getElementById('summary').textContent='Preencha as datas e horários para calcular.'; return; }
    const sd=new Date(start), ed=new Date(end);
    let count=0; for(let d=new Date(sd); d<=ed; d.setDate(d.getDate()+1)){ if(days.includes(d.getDay())) count++; }
    const h=calcHours(s,e); const totalH=count*h; const sub=totalH*rate; const fee=sub*0.10; const tot=sub+fee;
    document.getElementById('summary').innerHTML=`Dias contratados: <strong>${count}</strong> • Horas/dia: ${h} • Total horas: ${totalH}<br>Subtotal: ${formatCurrency(sub)} + Taxa 10%: ${formatCurrency(fee)} = <strong>${formatCurrency(tot)}</strong>`;
  }
  document.getElementById('formContratacao').addEventListener('input', updateSummary);
  document.getElementById('formContratacao').addEventListener('change', updateSummary);
  document.getElementById('formContratacao').addEventListener('submit', async e=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    const days=[...document.querySelectorAll('.day:checked')].map(x=>parseInt(x.value));
    const activities = fd.get('activitiesText').split(',').map(s=>s.trim()).filter(Boolean);
    const payload={
      clientId: authService.getCurrentUser().id,
      caregiverId: cgId,
      startDate: fd.get('startDate'),
      endDate: fd.get('endDate'),
      days, schedule:{ start: fd.get('scheduleStart'), end: fd.get('scheduleEnd') },
      activities, hourlyRate: parseFloat(fd.get('hourlyRate')), paymentMethod: fd.get('paymentMethod')
    };
    const btn=e.target.querySelector('button[type="submit"]'); showLoading(btn,'Criando...');
    try{
      const contract = await contractService.createContract(payload);
      notificationService.showSuccess('Contrato criado!');
      setTimeout(()=> window.location.href='contrato.html?id='+contract.id, 700);
    }catch(err){ const al=document.getElementById('formAlert'); al.textContent=err.message; al.className='alert alert-danger mt-3'; al.classList.remove('d-none'); hideLoading(btn); notificationService.showError(err.message); }
  });
  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
