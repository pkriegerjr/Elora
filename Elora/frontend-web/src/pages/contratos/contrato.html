<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contrato — Elora</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="../../css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-elora"><div class="container"><a class="navbar-brand" href="../../../index.html">EL<span>ORA</span></a><span data-user-menu class="d-none small" data-user-name></span></div></nav>
<div class="container py-4" id="root">
  <div class="text-center py-5"><div class="spinner-border"></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../config/config.js"></script>
<script src="../../services/apiService.js"></script>
<script src="../../services/mockData.js"></script>
<script src="../../services/authService.js"></script>
<script src="../../services/notificationService.js"></script>
<script src="../../services/clientService.js"></script>
<script src="../../services/caregiverService.js"></script>
<script src="../../services/contractService.js"></script>
<script src="../../services/paymentService.js"></script>
<script src="../../services/mapsService.js"></script>
<script src="../../services/app.js"></script>
<script>
  const id = new URLSearchParams(window.location.search).get('id');
  async function load(){
    const root=document.getElementById('root');
    if(!id){ root.innerHTML='<div class="alert alert-warning">Contrato não informado</div>'; return; }
    if(!authService.isAuthenticated()){ window.location.href='login.html?redirect=contrato.html?id='+id; return; }
    try{
      const c = await contractService.getContract(id);
      const status = await contractService.getContractStatus(id);
      const canSign = status.canSign;
      root.innerHTML=`
        <div class="stepper mb-4"><span class="step ${status.clientSigned?'done': status.status==='DRAFT'?'active':''}">1</span><span class="step-line"></span><span class="step ${status.status==='AWAITING_CAREGIVER_SIGNATURE'?'active': status.clientSigned?'done':''}">2</span><span class="step-line"></span><span class="step ${status.status==='SIGNED'?'done':''}">3</span></div>
        <div class="row g-4">
          <div class="col-lg-8">
            <div class="contract-paper p-4 p-md-5">
              <h4 class="text-center">CONTRATO DE PRESTAÇÃO DE SERVIÇOS — ELORA</h4>
              <p class="text-center small text-muted">Código: ${c.id} • Status: <strong>${status.statusLabel}</strong> • ${status.nextStep}</p>
              <hr>
              <p><strong>Contratante:</strong> ${c.client?.name||c.clientId} — CPF ${c.client?.cpf||''}</p>
              <p><strong>Cuidador:</strong> ${c.caregiver?.name||c.caregiverId} — CPF ${c.caregiver?.cpf||''} — R$ ${Number(c.hourlyRate).toFixed(2)}/h</p>
              <p><strong>Período:</strong> ${formatDate(c.startDate)} a ${formatDate(c.endDate)} • Dias: ${(c.days||[]).map(getDayShortName).join(', ')} • Horário: ${c.schedule?.start} - ${c.schedule?.end}</p>
              <p><strong>Atividades:</strong> ${(c.activities||[]).join(', ')}</p>
              <div class="bg-light p-3 rounded small">
                <div>Subtotal: ${formatCurrency(c.valueBreakdown?.subtotal||c.totalValue?.subtotal||0)} • Taxa 10%: ${formatCurrency(c.valueBreakdown?.platformFee||c.totalValue?.platformFee||0)} • <strong>Total: ${formatCurrency(c.valueBreakdown?.total||c.totalValue?.total||0)}</strong> • Horas totais: ${c.valueBreakdown?.totalHours||c.totalValue?.totalHours||0}</div>
              </div>
              <hr>
              <div class="row g-3 small">
                <div class="col-md-6">Assinatura Cliente: ${c.clientSignature? '✅ '+formatDateTime(c.clientSignature.signedAt) : '— pendente'}</div>
                <div class="col-md-6">Assinatura Cuidador: ${c.caregiverSignature? '✅ '+formatDateTime(c.caregiverSignature.signedAt) : '— pendente'}</div>
              </div>
              <div class="d-flex gap-2 mt-4">
                ${canSign? '<button id="btnSign" class="btn btn-elora-primary btn-lg"><i class="bi bi-pen me-1"></i> Assinar digitalmente</button>' : '<span class="text-muted small">'+status.nextStep+'</span>'}
                <button id="btnPdf" class="btn btn-outline-secondary"><i class="bi bi-file-earmark-pdf me-1"></i> Baixar PDF</button>
                ${status.status!=='SIGNED' && status.status!=='CANCELLED'? '<button id="btnCancel" class="btn btn-outline-danger btn-sm ms-auto">Cancelar</button>':''}
              </div>
              ${status.status==='SIGNED'? '<div class="alert alert-success mt-3">Contrato assinado! Próximo passo: <a href="../financeiro/pagamento.html"?contractId='+c.id+'">realizar pagamento</a>.</div>' : ''}
            </div>
          </div>
          <div class="col-lg-4">
            <div class="card-elora p-3">
              <h6>Trilha</h6>
              <ul class="small text-muted mb-0">
                <li>Criado em ${formatDateTime(c.createdAt)}</li>
                ${c.clientSignature? '<li>Cliente assinou em '+formatDateTime(c.clientSignature.signedAt)+'</li>':''}
                ${c.caregiverSignature? '<li>Cuidador assinou em '+formatDateTime(c.caregiverSignature.signedAt)+'</li>':''}
                ${c.signedAt? '<li>Concluído em '+formatDateTime(c.signedAt)+'</li>':''}
              </ul>
              <hr>
              <a href="#" data-action="dashboard" class="btn btn-elora-outline w-100 btn-sm">Ir para painel</a>
            </div>
          </div>
        </div>
      `;
      document.getElementById('btnSign')?.addEventListener('click', async()=>{
        const btn=document.getElementById('btnSign'); showLoading(btn,'Assinando...');
        try{ await contractService.signContract(id, { consent:true }); notificationService.showSuccess('Assinado com sucesso!'); setTimeout(()=> location.reload(), 700); }catch(err){ notificationService.showError(err.message); hideLoading(btn); }
      });
      document.getElementById('btnPdf')?.addEventListener('click', ()=> contractService.downloadContractPDF(id));
      document.getElementById('btnCancel')?.addEventListener('click', async()=>{
        const reason=prompt('Motivo do cancelamento:'); if(!reason) return;
        try{ await contractService.cancelContract(id, reason); notificationService.showWarning('Contrato cancelado'); setTimeout(()=> location.reload(), 700); }catch(err){ notificationService.showError(err.message); }
      });
    }catch(err){ root.innerHTML='<div class="alert alert-danger">'+err.message+'</div>'; }
  }
  document.addEventListener('DOMContentLoaded', load);
</script>
</body>
</html>
