<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avaliar — Elora</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="../../css/style.css" rel="stylesheet">
  <link href="../../css/responsive.css" rel="stylesheet">
</head>
<body class="bg-light">
  <a class="skip-link" href="#main">Pular para o conteúdo</a>
<nav class="navbar navbar-elora"><div class="container"><a class="navbar-brand" href="../../../index.html">EL<span>ORA</span></a><a href="#" data-action="dashboard" class="btn btn-elora-outline btn-sm" aria-label="Voltar ao painel"><i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Voltar</a></div></nav>
<div class="container py-5" id="main">
  <div class="row justify-content-center"><div class="col-lg-7">
    <div class="card-elora p-4 p-md-5" id="root">
      <div class="text-center py-4"><div class="spinner-border" role="status"><span class="sr-only">Carregando...</span></div></div>
    </div>
  </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../config/config.js"></script>
<script src="../../services/apiService.js"></script>
<script src="../../services/mockData.js"></script>
<script src="../../services/authService.js"></script>
<script src="../../services/notificationService.js"></script>
<script src="../../services/clientService.js"></script>
<script src="../../services/caregiverService.js"></script>
<script src="../../services/contractService.js"></script>
<script src="../../services/avaliacaoService.js"></script>
<script src="../../services/app.js"></script>
<script>
  const qs = new URLSearchParams(window.location.search);
  const contractId = qs.get('contractId') || qs.get('contratoId');
  const caregiverIdParam = qs.get('caregiverId') || qs.get('cuidadorId');
  async function load(){
    const root = document.getElementById('root');
    if(!authService.isAuthenticated()){ window.location.href='../auth/login.html?redirect='+encodeURIComponent('avaliacoes/avaliar.html'+(contractId?'?contractId='+contractId:caregiverIdParam?'?caregiverId='+caregiverIdParam:'')); return; }
    // modo cuidador: lista avaliações recebidas
    if(authService.isCaregiver() && !contractId){
      try{
        const me = authService.getCurrentUser();
        const list = await avaliacaoService.listarPorCuidador(me.id);
        const media = await avaliacaoService.mediaPorCuidador(me.id);
        root.innerHTML = `<h4>Minhas avaliações</h4>
          <p class="small text-muted">Média ${escapeHtml(media.media ?? 0)} (${escapeHtml(media.total ?? list.length)} avaliações) • GET /avaliacoes/cuidador/{id}</p>
          ${list.length ? list.map(r=>`<div class="border-bottom py-2"><span class="stars">${'★'.repeat(Number(r.rating)||0)}</span> <small class="text-muted">${r.createdAt?formatDate(r.createdAt):''}</small><p class="small mb-1">${escapeHtml(r.comment||'')}</p></div>`).join('') : '<p class="small text-muted">Ainda sem avaliações.</p>'}
          <a href="../escalas/agenda.html" class="btn btn-elora-outline w-100 mt-3">Voltar à agenda</a>`;
      }catch(err){ root.innerHTML = '<div class="alert alert-danger">'+escapeHtml(err.message)+'</div>'; }
      return;
    }
    // modo cliente: avaliar contrato
    if(!contractId){
      root.innerHTML = '<div class="alert alert-warning">Contrato não informado. Abra a avaliação pelo <a href="../dashboards/dashboard-cliente.html">painel</a> ou pelo contrato assinado.</div>';
      return;
    }
    try{
      const c = await contractService.getContract(contractId);
      if(await avaliacaoService.jaAvaliada(contractId)){
        const list = c.caregiverId ? await avaliacaoService.listarPorCuidador(c.caregiverId) : [];
        root.innerHTML = `<div class="alert alert-info">Este contrato já foi avaliado. Obrigado!</div>
          <a href="../contratos/contrato.html?id=${encodeURIComponent(contractId)}" class="btn btn-elora-outline w-100">Voltar ao contrato</a>`;
        return;
      }
      root.innerHTML = `
        <h4>Avaliar cuidador</h4>
        <p class="small text-muted">Contrato ${escapeHtml(c.id)} • ${escapeHtml(c.caregiver?.name||c.caregiverId||'')} • POST /avaliacoes (1 por contrato)</p>
        <form id="formAvaliar">
          <div class="mb-3"><span class="form-label fw-semibold" id="notaLabel">Nota *</span><div class="d-flex gap-2" role="radiogroup" aria-labelledby="notaLabel">
            ${[1,2,3,4,5].map(n=>`<label class="form-check"><input type="radio" name="nota" value="${n}" class="form-check-input" ${n===5?'checked':''} required> ${n}★</label>`).join('')}
          </div></div>
          <div class="mb-3"><label class="form-label" for="comentario">Comentário</label><textarea id="comentario" class="form-control" rows="3" maxlength="2000" placeholder="Como foi o cuidado? (opcional)"></textarea></div>
          <div id="formAlert" class="alert d-none" role="status"></div>
          <button type="submit" class="btn btn-elora-primary w-100">Enviar avaliação</button>
        </form>`;
      document.getElementById('formAvaliar')?.addEventListener('submit', async e=>{
        e.preventDefault();
        const nota = Number((new FormData(e.target).get('nota'))||0);
        const comentario = document.getElementById('comentario').value;
        const btn = e.target.querySelector('button[type="submit"]'); showLoading(btn, 'Enviando...');
        try{
          await avaliacaoService.criar({ contratoId, nota, comentario });
          notificationService.showSuccess('Avaliação enviada!'); setTimeout(()=> window.location.href='../contratos/contrato.html?id='+encodeURIComponent(contractId), 700);
        }catch(err){ const al=document.getElementById('formAlert'); al.textContent=err.message; al.className='alert alert-danger'; al.classList.remove('d-none'); hideLoading(btn); }
      });
    }catch(err){ root.innerHTML = '<div class="alert alert-danger">'+escapeHtml(err.message)+'</div>'; }
  }
  document.addEventListener('DOMContentLoaded', load);
</script>
</body>
</html>
