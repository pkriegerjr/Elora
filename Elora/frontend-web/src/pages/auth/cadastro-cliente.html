<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro Cliente — Elora</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="../../css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-elora"><div class="container"><a class="navbar-brand" href="../../../index.html">EL<span>ORA</span></a><a href="login.html" class="btn btn-elora-outline btn-sm">Já tenho conta</a></div></nav>
<div class="container py-5">
  <div class="row justify-content-center"><div class="col-lg-8">
    <div class="card-elora p-4 p-md-5">
      <div class="stepper mb-4"><span class="step active">1</span><span class="step-line"></span><span class="step">2</span><span class="step-line"></span><span class="step">3</span></div>
      <h2 class="section-title">Cadastro de Família / Cliente</h2>
      <p class="text-muted small">Seus dados são protegidos pela LGPD. CPF é armazenado só com dígitos e mascarado na exibição.</p>
      <form id="formCliente" novalidate>
        <h5 class="mt-4">Dados pessoais</h5>
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label">Nome completo *</label><input class="form-control" name="name" required></div>
          <div class="col-md-3"><label class="form-label">CPF *</label><input class="form-control" name="cpf" placeholder="000.000.000-00" required></div>
          <div class="col-md-3"><label class="form-label">Nascimento *</label><input type="date" class="form-control" name="birthDate" required></div>
          <div class="col-md-4"><label class="form-label">Telefone *</label><input class="form-control" name="phone" placeholder="(11) 99999-9999" required></div>
          <div class="col-md-4"><label class="form-label">E-mail *</label><input type="email" class="form-control" name="email" required></div>
          <div class="col-md-4"><label class="form-label">Senha *</label><input type="password" class="form-control" name="password" placeholder="Min 8, Aa1! " required><small class="text-muted">Ao!Aa1 exigidos</small></div>
        </div>
        <h5 class="mt-4">Endereço</h5>
        <div class="row g-3">
          <div class="col-md-3"><label class="form-label">CEP</label><input class="form-control" name="cep" id="cep" placeholder="01310-100"><small class="text-muted">Auto-preenche via ViaCEP</small></div>
          <div class="col-md-2"><label class="form-label">UF</label><input class="form-control" name="state" id="state"></div>
          <div class="col-md-4"><label class="form-label">Cidade</label><input class="form-control" name="city" id="city"></div>
          <div class="col-md-3"><label class="form-label">Bairro</label><input class="form-control" name="neighborhood" id="neighborhood"></div>
          <div class="col-md-6"><label class="form-label">Rua</label><input class="form-control" name="street" id="street"></div>
          <div class="col-md-2"><label class="form-label">Número</label><input class="form-control" name="number"></div>
          <div class="col-md-4"><label class="form-label">Complemento</label><input class="form-control" name="complemento"></div>
        </div>
        <h5 class="mt-4">Necessidade de cuidado</h5>
        <div class="row g-3">
          <div class="col-md-4"><label class="form-label">Tipo</label><select class="form-select" name="careType"><option value="idoso">Idoso</option><option value="pcd">PcD</option><option value="pos_operatorio">Pós-operatório</option><option value="outro">Outro</option></select></div>
          <div class="col-md-8"><label class="form-label">Descrição</label><input class="form-control" name="careDescription" placeholder="Ex: mobilidade reduzida, medicação..."></div>
          <div class="col-12"><label class="form-label">Dias da semana</label>
            <div class="d-flex gap-2 flex-wrap">
              <label class="form-check"><input type="checkbox" value="1" class="form-check-input day-check"> Seg</label>
              <label class="form-check"><input type="checkbox" value="2" class="form-check-input day-check"> Ter</label>
              <label class="form-check"><input type="checkbox" value="3" class="form-check-input day-check"> Qua</label>
              <label class="form-check"><input type="checkbox" value="4" class="form-check-input day-check"> Qui</label>
              <label class="form-check"><input type="checkbox" value="5" class="form-check-input day-check"> Sex</label>
              <label class="form-check"><input type="checkbox" value="6" class="form-check-input day-check"> Sáb</label>
              <label class="form-check"><input type="checkbox" value="0" class="form-check-input day-check"> Dom</label>
            </div>
          </div>
          <div class="col-md-3"><label class="form-label">Início</label><input type="time" class="form-control" name="scheduleStart" value="08:00"></div>
          <div class="col-md-3"><label class="form-label">Fim</label><input type="time" class="form-control" name="scheduleEnd" value="17:00"></div>
          <div class="col-md-3"><label class="form-label">Data início</label><input type="date" class="form-control" name="startDate"></div>
          <div class="col-md-3"><label class="form-label">Duração</label><select class="form-select" name="duration"><option>indeterminado</option><option>30 dias</option><option>60 dias</option></select></div>
        </div>
        <div class="form-check mt-4"><input class="form-check-input" type="checkbox" id="lgpd" required><label class="form-check-label small" for="lgpd">Li e aceito os <a href="#">Termos</a> e a <a href="#">Política de Privacidade (LGPD)</a> *</label></div>
        <div id="formAlert" class="alert d-none mt-3"></div>
        <button type="submit" class="btn btn-elora-primary btn-lg w-100 mt-3">Criar conta</button>
        <p class="text-center small mt-3">Já tem conta? <a href="login.html">Entrar</a></p>
      </form>
    </div>
  </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../config/config.js"></script>
<script src="../../services/apiService.js"></script>
<script src="../../services/mockData.js"></script>
<script src="../../services/authService.js"></script>
<script src="../../services/notificationService.js"></script>
<script src="../../services/clientService.js"></script>
<script src="../../services/caregiverService.js"></script>
<script src="../../services/contractService.js"></script>
<script src="../../services/paymentService.js"></script>
<script src="../../services/mapsService.js"></script>
<script src="../../services/app.js"></script>
<script>
  document.getElementById('cep')?.addEventListener('blur', async e=>{
    const data = await fetchAddressFromCEP(e.target.value);
    if(data){ document.getElementById('state').value=data.state; document.getElementById('city').value=data.city; document.getElementById('neighborhood').value=data.neighborhood; document.getElementById('street').value=data.street; }
  });
  document.getElementById('formCliente').addEventListener('submit', async e=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    const days=[...document.querySelectorAll('.day-check:checked')].map(el=>parseInt(el.value));
    const payload={
      name: fd.get('name'), cpf: fd.get('cpf'), birthDate: fd.get('birthDate'), phone: fd.get('phone'),
      email: fd.get('email'), password: fd.get('password'),
      address:{ cep: fd.get('cep'), state: fd.get('state'), city: fd.get('city'), neighborhood: fd.get('neighborhood'), street: fd.get('street'), number: fd.get('number'), complemento: fd.get('complemento') },
      careNeeds:{ type: fd.get('careType'), description: fd.get('careDescription'), days, schedule:{ start: fd.get('scheduleStart'), end: fd.get('scheduleEnd') }, startDate: fd.get('startDate'), duration: fd.get('duration') }
    };
    const btn=e.target.querySelector('button[type="submit"]'); showLoading(btn,'Criando...');
    try{
      if(!validateCPF(payload.cpf)) throw new Error('CPF inválido');
      await authService.register(payload, CONFIG.USER_TYPES.CLIENT);
      notificationService.showSuccess('Conta criada! Faça login.');
      setTimeout(()=> window.location.href='login.html', 800);
    }catch(err){
      const al=document.getElementById('formAlert'); al.textContent=err.message; al.className='alert alert-danger mt-3'; al.classList.remove('d-none'); notificationService.showError(err.message); hideLoading(btn);
    }
  });
</script>
</body>
</html>
