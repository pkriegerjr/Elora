<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir senha — Elora</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="../../css/style.css" rel="stylesheet">
  <link href="../../css/responsive.css" rel="stylesheet">
</head>
<body class="bg-light">
  <a class="skip-link" href="#main">Pular para o conteúdo</a>
<nav class="navbar navbar-elora">
  <div class="container">
    <a class="navbar-brand" href="../../../index.html">EL<span>ORA</span></a>
    <a href="login.html" class="btn btn-elora-outline btn-sm"><i class="bi bi-arrow-left me-1"></i> Voltar ao login</a>
  </div>
</nav>

<div class="container py-5" id="main">
  <div class="row justify-content-center">
    <div class="col-lg-5">
      <div class="card-elora p-4 p-md-5">
        <div class="text-center mb-4">
          <h2 class="section-title mb-1">Redefinir senha</h2>
          <p class="text-muted small mb-0">Crie uma nova senha para sua conta Elora</p>
        </div>

        <div id="tokenAlert" class="alert alert-danger d-none" role="alert"></div>

        <form id="resetForm" novalidate>
          <div class="mb-3">
            <label class="form-label" for="novaSenha">Nova senha</label>
            <input type="password" class="form-control" id="novaSenha" name="novaSenha" autocomplete="new-password" required aria-describedby="senhaHint">
            <div id="senhaHint" class="form-text">Mínimo 8 caracteres, com maiúscula, minúscula, número e caractere especial (@$!%*?&#).</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="confirmarSenha">Confirmar nova senha</label>
            <input type="password" class="form-control" id="confirmarSenha" name="confirmarSenha" autocomplete="new-password" required>
          </div>
          <button type="submit" class="btn btn-elora-primary w-100 btn-lg" id="btnSubmit">Redefinir senha</button>
        </form>

        <div id="resetAlert" class="alert d-none mt-3" role="status"></div>
        <p class="text-center small mt-3 mb-0"><a href="login.html">Voltar ao login</a></p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../config/config.js?v=20261126-4"></script>
<script src="../../services/apiService.js?v=20261126-4"></script>
<script src="../../services/mockData.js?v=20261126-4"></script>
<script src="../../services/authService.js?v=20261126-4"></script>
<script src="../../services/notificationService.js?v=20261126-4"></script>
<script src="../../services/app.js?v=20261126-4"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const SENHA_REGEX = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&#]).{8,}$/;

  function showAlert(el, msg, type){
    el.textContent = msg;
    el.className = 'alert alert-' + type;
    el.classList.remove('d-none');
  }

  if(!token){
    const al = document.getElementById('tokenAlert');
    showAlert(al, 'Link inválido: token de redefinição ausente. Solicite um novo link na tela de login.', 'danger');
    document.getElementById('resetForm').classList.add('d-none');
  }

  document.getElementById('resetForm')?.addEventListener('submit', async e=>{
    e.preventDefault();
    if(!token) return;
    const senha = document.getElementById('novaSenha').value;
    const confirmar = document.getElementById('confirmarSenha').value;
    const alertEl = document.getElementById('resetAlert');

    if(!SENHA_REGEX.test(senha)){
      showAlert(alertEl, 'A senha não atende aos requisitos mínimos.', 'danger');
      return;
    }
    if(senha !== confirmar){
      showAlert(alertEl, 'As senhas não conferem.', 'danger');
      return;
    }

    const btn = document.getElementById('btnSubmit');
    btn.disabled = true;
    btn.textContent = 'Redefinindo...';
    try{
      await authService.confirmPasswordReset(token, senha);
      showAlert(alertEl, 'Senha redefinida com sucesso! Redirecionando para o login...', 'success');
      document.getElementById('resetForm').classList.add('d-none');
      setTimeout(()=> window.location.href = 'login.html', 1500);
    }catch(err){
      showAlert(alertEl, err.message || 'Não foi possível redefinir a senha.', 'danger');
      btn.disabled = false;
      btn.textContent = 'Redefinir senha';
    }
  });
</script>
</body>
</html>
