<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notificações — Elora</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-elora sticky-top"><div class="container"><a class="navbar-brand" href="../../../index.html">EL<span>ORA</span></a>
  <div class="d-flex gap-2"><a href="#" data-action="dashboard" class="btn btn-elora-outline btn-sm">Painel</a><span class="badge bg-danger align-self-center" data-notification-badge>0</span></div>
</div></nav>
<div class="container py-4">
  <div class="row g-4">
    <div class="col-lg-8">
      <div class="card-elora p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4 class="mb-0">Notificações <span id="badgeCount" class="badge bg-danger d-none">0</span></h4>
          <button id="btnReadAll" class="btn btn-outline-secondary btn-sm">Marcar todas como lidas</button>
        </div>
        <div class="d-flex gap-2 mb-3">
          <select id="fTipo" class="form-select form-select-sm" style="width:auto"><option value="">Todos tipos</option><option value="contrato">Contrato</option><option value="pagamento">Pagamento</option><option value="sistema">Sistema</option></select>
          <div class="form-check ms-2"><input class="form-check-input" type="checkbox" id="fUnread"><label class="form-check-label small" for="fUnread">Só não lidas</label></div>
          <button id="btnFiltrar" class="btn btn-elora-primary btn-sm">Filtrar</button>
        </div>
        <div id="list" class="vstack gap-2"></div>
        <div id="empty" class="text-center text-muted py-4 d-none">Nenhuma notificação.</div>
      </div>
    </div>
    <div class="col-lg-4">
      <div class="card-elora p-3">
        <h5>Preferências</h5><p class="small text-muted">Canais da PT <code>PreferenciaNotificacao</code> (`preferencias`)</p>
        <div class="form-check"><input class="form-check-input" type="checkbox" id="pPush"><label class="form-check-label" for="pPush">Push</label></div>
        <div class="form-check"><input class="form-check-input" type="checkbox" id="pEmail"><label class="form-check-label" for="pEmail">E-mail</label></div>
        <div class="form-check"><input class="form-check-input" type="checkbox" id="pSms"><label class="form-check-label" for="pSms">SMS</label></div>
        <button id="btnSalvarPref" class="btn btn-elora-primary btn-sm w-100 mt-2">Salvar preferências</button>
        <div id="prefMsg" class="small mt-2"></div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../config/config.js"></script>
<script src="../../services/apiService.js"></script>
<script src="../../services/mockData.js"></script>
<script src="../../services/authService.js"></script>
<script src="../../services/notificationService.js"></script>
<script src="../../services/clientService.js"></script>
<script src="../../services/caregiverService.js"></script>
<script src="../../services/contractService.js"></script>
<script src="../../services/paymentService.js"></script>
<script src="../../services/mapsService.js"></script>
<script src="../../services/app.js"></script>
<script>
  async function load(){
    if(!authService.isAuthenticated()){ window.location.href=authService.getLoginUrl('notificacoes/lista.html'); return; }
    const tipo=document.getElementById('fTipo').value;
    const unreadOnly=document.getElementById('fUnread').checked;
    try{
      const items=await notificationService.getNotifications({ tipo: tipo||undefined, unreadOnly, limit:50 });
      const list=document.getElementById('list');
      document.getElementById('empty').classList.toggle('d-none', items.length>0);
      list.innerHTML=items.map(n=>`
        <div class="border rounded p-3 ${n.lida||n.read?'bg-light opacity-75':''}">
          <div class="d-flex justify-content-between"><strong class="small">${n.titulo||n.title||'Notificação'}</strong><small class="text-muted">${n.enviadoEm? formatDateTime(n.enviadoEm): formatDateTime(n.createdAt)}</small></div>
          <div class="small text-muted">${n.corpo||n.message||''}</div>
          <div class="small"><span class="badge bg-secondary">${n.canal||'sistema'}</span> ${n.referenciaTipo? '<span class="badge bg-info text-dark">'+n.referenciaTipo+'</span>':''}</div>
          <div class="mt-2 d-flex gap-2">
            ${!n.lida && !n.read? '<button class="btn btn-sm btn-elora-outline btn-read" data-id="'+n.id+'">Marcar lida (PATCH /{id} {lida:true})</button>':''}
            <button class="btn btn-sm btn-outline-danger btn-del" data-id="'+n.id+'">Excluir (DELETE /{id})</button>
          </div>
        </div>
      `).join('');
      list.querySelectorAll('.btn-read').forEach(b=> b.addEventListener('click', async()=>{ await notificationService.markAsRead(b.dataset.id); load(); }));
      list.querySelectorAll('.btn-del').forEach(b=> b.addEventListener('click', async()=>{ if(!confirm('Excluir?')) return; await notificationService.deleteNotification(b.dataset.id); load(); }));
      await notificationService.updateUnreadCount();
      document.getElementById('badgeCount').textContent=notificationService.unreadCount;
      document.getElementById('badgeCount').classList.toggle('d-none', notificationService.unreadCount===0);
    }catch(err){ document.getElementById('list').innerHTML='<div class="alert alert-danger">'+err.message+'</div>'; }
  }
  async function loadPref(){
    try{ const p=await notificationService.getPreferences(); document.getElementById('pPush').checked=!!p.push; document.getElementById('pEmail').checked=!!p.email; document.getElementById('pSms').checked=!!p.sms; }catch(e){ document.getElementById('prefMsg').textContent=e.message; }
  }
  document.getElementById('btnFiltrar')?.addEventListener('click', load);
  document.getElementById('btnReadAll')?.addEventListener('click', async()=>{ await notificationService.markAllAsRead(); load(); });
  document.getElementById('btnSalvarPref')?.addEventListener('click', async()=>{
    try{ await notificationService.updatePreferences({ push: document.getElementById('pPush').checked, email: document.getElementById('pEmail').checked, sms: document.getElementById('pSms').checked }); document.getElementById('prefMsg').innerHTML='<span class="text-success">Salvo! PATCH /preferences</span>'; }catch(e){ document.getElementById('prefMsg').innerHTML='<span class="text-danger">'+e.message+'</span>'; }
  });
  document.addEventListener('DOMContentLoaded', ()=>{ load(); loadPref(); });
</script>
</body>
</html>
