<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscar Cuidadores — Elora</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="../../css/style.css" rel="stylesheet">
  <link href="../../css/responsive.css" rel="stylesheet">
</head>
<body>
  <a class="skip-link" href="#main">Pular para o conteúdo</a>
<nav class="navbar navbar-elora sticky-top"><div class="container"><a class="navbar-brand" href="../../../index.html">EL<span>ORA</span></a>
  <div class="ms-auto d-flex align-items-center gap-2">
    <span data-auth-buttons><a href="../../../index.html" class="btn btn-elora-outline btn-sm" aria-label="Voltar à página inicial"><i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Voltar</a> <a href="../auth/login.html" class="btn btn-elora-outline btn-sm">Entrar</a></span>
    <span data-user-menu class="d-none"><span data-user-name class="fw-semibold small"></span> <a href="#" data-action="dashboard" class="btn btn-elora-primary btn-sm" aria-label="Voltar ao painel"><i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Voltar</a> <a href="#" data-action="logout" class="btn btn-outline-danger btn-sm">Sair</a></span>
  </div>
</div></nav>
<div class="container py-4" id="main">
  <div class="row g-4">
    <div class="col-lg-3">
      <div class="filter-sidebar">
        <h5 class="fw-bold">Filtros</h5>
        <div class="mb-3">
          <label id="fSpecialtyLabel" class="form-label small fw-semibold">Especialidade</label>
          <div id="fSpecialty" class="specialty-check-list specialty-check-list--sidebar" role="group" aria-labelledby="fSpecialtyLabel"></div>
        </div>
        <div class="mb-3">
          <label for="fRating" class="form-label small fw-semibold">Avaliação mínima</label>
          <select id="fRating" class="form-select form-select-sm">
            <option value="">Qualquer</option>
            <option value="1.0">★ 1.0+</option>
            <option value="2.0">★★ 2.0+</option>
            <option value="3.0">★★★ 3.0+</option>
            <option value="4.0">★★★★ 4.0+</option>
            <option value="5.0">★★★★★ 5.0+</option>
          </select>
        </div>
        <div class="mb-3"><label class="form-label small fw-semibold">Preço máx/h <span class="range-value" id="priceVal">R$ 200</span></label><input type="range" id="fPrice" class="form-range" min="20" max="200" value="200" aria-label="Preço máximo por hora"></div>
        <div class="mb-3"><label class="form-label small fw-semibold">Raio <span class="range-value" id="radiusVal">10 km</span></label><input type="range" id="fRadius" class="form-range" min="1" max="50" value="10" aria-label="Raio de busca em km"></div>
        <div class="mb-3">
          <label for="fCep" class="form-label small fw-semibold">CEP</label>
          <input id="fCep" class="form-control form-control-sm" placeholder="00000-000" maxlength="9" inputmode="numeric" aria-label="CEP">
          <button id="btnCep" class="btn btn-outline-primary btn-sm w-100 mt-2"><i class="bi bi-search me-1"></i> Buscar CEP</button>
        </div>
        <div class="mb-3 position-relative">
          <label for="fLocation" class="form-label small fw-semibold">Localização</label>
          <input id="fLocation" class="form-control form-control-sm" placeholder="Digite rua, cidade ou CEP..." autocomplete="off" aria-autocomplete="list" aria-controls="locationSuggestions">
          <div id="locationSuggestions" class="list-group position-absolute w-100 mt-1 shadow-sm d-none" style="z-index:1100;max-height:240px;overflow-y:auto;"></div>
          <div class="row g-2 mt-1">
            <div class="col-8"><input id="fCity" class="form-control form-control-sm" readonly placeholder="Cidade"></div>
            <div class="col-4"><input id="fState" class="form-control form-control-sm" readonly placeholder="UF"></div>
          </div>
          <input type="hidden" id="fLat"><input type="hidden" id="fLng">
          <button id="btnLoc" class="btn btn-outline-secondary btn-sm w-100 mt-2"><i class="bi bi-geo-fill me-1"></i> Usar localização padrão</button>
        </div>
        <div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="fVerified"><label class="form-check-label small" for="fVerified">Só verificados</label></div>
        <button id="btnSearch" class="btn btn-elora-primary w-100"><i class="bi bi-search me-1"></i> Aplicar</button>
        <button id="btnClear" class="btn btn-outline-secondary w-100 mt-2 btn-sm">Limpar</button>
        <div id="resultCount" class="small text-muted mt-3"></div>
      </div>
    </div>
    <div class="col-lg-9">
      <div id="map" class="mb-3" style="min-height:340px" role="application" aria-label="Mapa de cuidadores"></div>
      <div id="caregiverList" class="row g-3"></div>
      <div id="loading" class="text-center py-5 d-none" role="status" aria-live="polite"><div class="spinner-border text-primary"></div><p class="small text-muted mt-2">Buscando cuidadores...</p></div>
      <div id="empty" class="text-center py-5 d-none" role="status" aria-live="polite"><i class="bi bi-inbox fs-1 text-muted"></i><p class="text-muted">Nenhum cuidador encontrado com esses filtros.</p></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../config/config.js?v=20261126-5"></script>
<script src="../../services/locationService.js?v=20261126-5"></script>
<script src="../../services/apiService.js?v=20261126-5"></script>
<script src="../../services/mockData.js?v=20261126-5"></script>
<script src="../../services/authService.js?v=20261126-5"></script>
<script src="../../services/notificationService.js?v=20261126-5"></script>
<script src="../../services/clientService.js?v=20261126-5"></script>
<script src="../../services/caregiverService.js?v=20261126-5"></script>
<script src="../../services/contractService.js?v=20261126-5"></script>
<script src="../../services/paymentService.js?v=20261126-5"></script>
<script src="../../services/mapsService.js?v=20261126-5"></script>
<script src="../../services/app.js?v=20261126-5"></script>
<script>
  const qs = new URLSearchParams(window.location.search);
  let currentLocation = null; // {lat,lng,label,city,state,...}
  let suppressLocationInput = false;
  let locationDebounce = null;

  function maskCepInput(value){ return locationService.maskCep(value); }
  function hideSuggestions(){ document.getElementById('locationSuggestions').classList.add('d-none'); }

  function currentBias(){
    const base = currentLocation || mapsService.userLocation || {
      lat: CONFIG.LOCATION_IP.latitude, lng: CONFIG.LOCATION_IP.longitude,
      city: CONFIG.LOCATION_IP.city, state: CONFIG.LOCATION_IP.region_name
    };
    return {
      lat: base.lat, lng: base.lng,
      city: base.city || (currentLocation && currentLocation.city) || (CONFIG.LOCATION_IP.city || ''),
      state: base.state || (currentLocation && currentLocation.state) || (CONFIG.LOCATION_IP.region_name || '')
    };
  }

  function applyLocation(loc){
    if(!loc || !isFinite(loc.lat) || !isFinite(loc.lng)) return;
    currentLocation = loc;
    suppressLocationInput = true;
    document.getElementById('fLocation').value = loc.label || '';
    suppressLocationInput = false;
    hideSuggestions();
    document.getElementById('fCity').value = loc.city || '';
    document.getElementById('fState').value = loc.state || '';
    document.getElementById('fLat').value = loc.lat;
    document.getElementById('fLng').value = loc.lng;
    mapsService.userLocation = { lat: loc.lat, lng: loc.lng };
    if(mapsService.map && typeof L !== 'undefined'){
      mapsService.map.setView([loc.lat, loc.lng], mapsService.map.getZoom());
    }
  }

  async function resolveCepInput(){
    const digits = locationService.onlyDigits(document.getElementById('fCep').value);
    if(digits.length !== 8){ notificationService.showError('Digite um CEP válido com 8 dígitos'); return; }
    const btn = document.getElementById('btnCep');
    btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></i> Buscando...';
    try{
      const loc = await locationService.resolveCep(digits);
      applyLocation(loc);
      notificationService.showSuccess('Localização: ' + loc.label);
      await doSearch();
    }catch(err){ notificationService.showError(err.message); }
    finally{ btn.disabled = false; btn.innerHTML = '<i class="bi bi-search me-1"></i> Buscar CEP'; }
  }

  function renderSuggestions(items){
    const box = document.getElementById('locationSuggestions');
    if(!items || !items.length){ hideSuggestions(); return; }
    box.innerHTML = items.map((it,i)=>
      `<button type="button" class="list-group-item list-group-item-action small" data-index="${i}"><i class="bi bi-geo-alt me-2"></i>${escapeHtml(it.label || it.displayName || '')}</button>`
    ).join('');
    box.classList.remove('d-none');
    box.querySelectorAll('button').forEach(btn=> btn.addEventListener('click', ()=>{
      const item = items[Number(btn.dataset.index)];
      hideSuggestions();
      applyLocation(item);
      doSearch();
    }));
  }

  // Catálogo vem do backend — nada de slugs fixos.
  async function loadEspecialidades(){
    const box=document.getElementById('fSpecialty');
    try{
      const lista=await caregiverService.getEspecialidades();
      box.innerHTML =
        '<div class="form-check"><input class="form-check-input" type="checkbox" id="fEspAll" checked><label class="form-check-label" for="fEspAll">Todas</label></div>' +
        lista.map(e=>{
          const id=`fEsp-${escapeHtml(String(e.id))}`;
          const nome=escapeHtml(e.nome);
          return `<div class="form-check"><input class="form-check-input" type="checkbox" id="${id}" value="${escapeHtml(String(e.id))}" data-nome="${nome}"><label class="form-check-label" for="${id}">${nome}</label></div>`;
        }).join('');
    }catch(err){
      console.warn('Não foi possível carregar especialidades:', err.message);
    }
  }
  document.getElementById('fSpecialty')?.addEventListener('change', e=>{
    const box=e.currentTarget;
    const all=document.getElementById('fEspAll');
    if(!all) return;
    if(e.target===all){
      if(all.checked) box.querySelectorAll('input[data-nome]').forEach(i=> i.checked=false);
    } else if(e.target.checked){
      all.checked=false;
    } else if(!box.querySelector('input[data-nome]:checked')){
      all.checked=true;
    }
  });
  const normTag = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/gi,'').toLowerCase();
  async function syncFromQS(){
    const paramsEsp=[...qs.getAll('especialidadeId'), ...qs.getAll('specialty')].filter(Boolean).map(normTag);
    if(paramsEsp.length){
      const box=document.getElementById('fSpecialty');
      let marcados=0;
      box.querySelectorAll('input[data-nome]').forEach(i=>{
        const tags=[i.value, i.dataset.nome].map(normTag);
        if(paramsEsp.some(a=> tags.some(t=> t===a || t.includes(a) || a.includes(t)))){
          i.checked=true; marcados++;
        }
      });
      const all=document.getElementById('fEspAll');
      if(marcados && all) all.checked=false;
    }
    if(qs.get('minRating')) document.getElementById('fRating').value=qs.get('minRating');
    if(qs.get('radius')) document.getElementById('fRadius').value=qs.get('radius');
    const locParam = qs.get('location');
    if(locParam){
      const digits = locationService.onlyDigits(locParam);
      if(digits.length === 8 && !locParam.includes(',')){
        document.getElementById('fCep').value = locationService.maskCep(digits);
        await resolveCepInput();
      } else {
        let parsed = await locationService.resolveText(locParam);
        if(parsed && isFinite(parsed.lat) && isFinite(parsed.lng)){
          try{
            const readable = await locationService.reverse(parsed.lat, parsed.lng);
            if(readable) parsed = { ...parsed, label: readable.label, city: readable.city, state: readable.state,
              street: readable.street, neighborhood: readable.neighborhood, number: readable.number };
          }catch(err){ console.warn('Reverse geocode indisponível:', err.message); }
        }
        if(parsed) applyLocation(parsed);
        else document.getElementById('fLocation').value = locParam;
      }
    }
    document.getElementById('radiusVal').textContent = document.getElementById('fRadius').value + ' km';
    document.getElementById('priceVal').textContent = 'R$ ' + document.getElementById('fPrice').value;
  }
  document.getElementById('fRadius').addEventListener('input', e=> document.getElementById('radiusVal').textContent=e.target.value+' km');
  document.getElementById('fPrice').addEventListener('input', e=> document.getElementById('priceVal').textContent='R$ '+e.target.value);
  document.getElementById('fCep').addEventListener('input', e=> e.target.value = maskCepInput(e.target.value));
  document.getElementById('fCep').addEventListener('blur', ()=>{
    if(locationService.onlyDigits(document.getElementById('fCep').value).length === 8) resolveCepInput();
  });
  document.getElementById('btnCep').addEventListener('click', resolveCepInput);
  document.getElementById('btnLoc').addEventListener('click', async()=>{
    try{
      const loc = await mapsService.getUserLocation();
      const ip = CONFIG.LOCATION_IP;
      applyLocation({
        lat: loc.lat, lng: loc.lng,
        label: `${ip.city || 'Localização'} - ${ip.region_name || ''} - ${ip.country_name || 'Brasil'}`.replace(/\s*-\s*$/,''),
        city: ip.city || '', state: ip.region_name || '', country: ip.country_name || 'Brasil'
      });
      await doSearch();
    }catch(err){ notificationService.showError(err.message); }
  });

  // Localização editável com sugestões (tipo Google Maps).
  document.getElementById('fLocation').addEventListener('input', e=>{
    if(suppressLocationInput) return;
    const value = e.target.value.trim();
    if(value.length < 3){ hideSuggestions(); return; }
    clearTimeout(locationDebounce);
    locationDebounce = setTimeout(async()=>{
      try{ renderSuggestions(await locationService.autocomplete(value, 5, currentBias())); }
      catch(err){ console.warn('Autocomplete indisponível:', err.message); hideSuggestions(); }
    }, 450);
  });
  document.getElementById('fLocation').addEventListener('keydown', async e=>{
    if(e.key === 'Escape'){ hideSuggestions(); return; }
    if(e.key !== 'Enter') return;
    e.preventDefault();
    const value = e.target.value.trim();
    const digits = locationService.onlyDigits(value);
    if(digits.length === 8 && !value.includes(',')){
      document.getElementById('fCep').value = locationService.maskCep(digits);
      hideSuggestions();
      await resolveCepInput();
      return;
    }
    const first = document.querySelector('#locationSuggestions button');
    if(first){ first.click(); return; }
    try{
      const parsed = await locationService.resolveText(value);
      if(parsed){ applyLocation(parsed); await doSearch(); }
      else notificationService.showError('Localização não encontrada');
    }catch(err){ notificationService.showError(err.message); }
  });
  document.addEventListener('click', e=>{
    if(!e.target.closest('.position-relative') || !e.target.closest('#fLocation, #locationSuggestions')) hideSuggestions();
  });

  // Arrastar o ponto azul atualiza endereço e pesquisa.
  mapsService.onUserLocationDrag = async (lat, lng)=>{
    try{
      const loc = await locationService.reverse(lat, lng);
      if(loc) applyLocation(loc);
      await doSearch();
    }catch(err){ console.warn('Não foi possível atualizar o endereço ao arrastar:', err.message); }
  };

  document.getElementById('btnSearch').addEventListener('click', doSearch);
  document.getElementById('btnClear').addEventListener('click', ()=>{
    document.querySelectorAll('#fSpecialty input[type="checkbox"]').forEach(i=> i.checked = i.id === 'fEspAll');
    document.getElementById('fRating').value='';
    document.getElementById('fPrice').value=200; document.getElementById('fRadius').value=10;
    document.getElementById('fCep').value='';
    document.getElementById('fCity').value=''; document.getElementById('fState').value='';
    document.getElementById('fLat').value=''; document.getElementById('fLng').value='';
    document.getElementById('fLocation').value=''; document.getElementById('fVerified').checked=false;
    currentLocation = null;
    doSearch();
  });

  async function doSearch(){
    const selecionadas=[...document.querySelectorAll('#fSpecialty input[data-nome]:checked')];
    // API filtra por especialidadeId (lista); mock filtra pelas tags.
    const especialidadeIds=selecionadas.map(i=>Number(i.value)).filter(Number.isFinite);
    const specialties=selecionadas.map(i=>i.dataset.nome);
    const filters={
      especialidadeIds,
      specialties,
      minRating: parseFloat(document.getElementById('fRating').value) || undefined,
      maxPrice: parseInt(document.getElementById('fPrice').value) || undefined,
      distance: parseInt(document.getElementById('fRadius').value),
      verifiedOnly: document.getElementById('fVerified').checked || undefined,
      userLocation: null
    };
    if(currentLocation && isFinite(currentLocation.lat)){
      filters.userLocation = { lat: currentLocation.lat, lng: currentLocation.lng };
    } else {
      const hiddenLat = document.getElementById('fLat').value;
      const hiddenLng = document.getElementById('fLng').value;
      if(hiddenLat && hiddenLng) filters.userLocation = { lat: Number(hiddenLat), lng: Number(hiddenLng) };
      else if(mapsService.userLocation) filters.userLocation = mapsService.userLocation;
    }

    document.getElementById('loading').classList.remove('d-none');
    document.getElementById('caregiverList').innerHTML='';
    document.getElementById('empty').classList.add('d-none');
    try{
      // O service já mapeia o DTO do backend (nome→name, notaMedia→rating, ...)
      // e também aplica os filtros de verificados/distância no cliente.
      const caregivers = await caregiverService.searchCaregivers(filters);
      await renderList(caregivers);
      // mapa
      await mapsService.initializeMap({ containerId:'map' });
      if(caregivers.length) mapsService.createCaregiverMarkers(caregivers);
      document.getElementById('resultCount').textContent = caregivers.length + ' cuidador(es) encontrado(s)';
    }catch(err){ notificationService.showError(err.message); }
    finally{ document.getElementById('loading').classList.add('d-none'); }
  }

  function setFavButtonState(btn, favorited) {
    btn.classList.toggle('is-favorited', favorited);
    btn.setAttribute('aria-pressed', String(favorited));
    btn.title = favorited ? 'Remover dos favoritos' : 'Favoritar';
    btn.setAttribute('aria-label', favorited ? 'Remover cuidador dos favoritos' : 'Favoritar cuidador');
    btn.innerHTML = favorited
      ? '<i class="bi bi-heart-fill" aria-hidden="true"></i>'
      : '<i class="bi bi-heart" aria-hidden="true"></i>';
  }

  async function renderList(list){
    const el=document.getElementById('caregiverList');
    if(!list.length){ document.getElementById('empty').classList.remove('d-none'); return; }
    el.innerHTML = list.map(c=>`
      <div class="col-md-6">
        <div class="card-elora caregiver-card p-3 h-100">
          <div class="d-flex gap-3">
            <div class="avatar-placeholder"><i class="bi bi-person"></i></div>
            <div class="flex-grow-1">
              <div class="d-flex align-items-center gap-2"><strong>${escapeHtml(c.name)}</strong> ${c.verified?'<span class="verified small"><i class="bi bi-patch-check-fill"></i> Verificado</span>':''}</div>
              <div class="small text-muted">${escapeHtml((c.specialties||[]).slice(0,3).join(' • '))}</div>
              <div class="small"><span class="stars">${'★'.repeat(Math.floor(c.rating||0))}${'☆'.repeat(5-Math.floor(c.rating||0))}</span> ${(c.rating||0).toFixed(1)} (${c.reviewCount||0}) ${c.distance? '• '+c.distance+' km':''}</div>
              <div class="small text-muted">${(c.address?.neighborhood||c.address?.city)?`<i class="bi bi-geo-alt me-1"></i>${escapeHtml(c.address.neighborhood||c.address.city)} • `:''}R$ ${Number(c.hourlyRate||0).toFixed(2)}/h</div>
            </div>
            <button class="btn btn-outline-primary btn-sm align-self-start fav-btn" data-id="${c.id}" title="Favoritar" aria-label="Favoritar cuidador" aria-pressed="false"><i class="bi bi-heart" aria-hidden="true"></i></button>
          </div>
          <p class="small text-muted mt-2 mb-2" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${escapeHtml(c.bio||'')}</p>
          <div class="d-flex gap-2">
            <a href="../busca/perfil-cuidador.html?id=${c.id}" class="btn btn-elora-primary btn-sm flex-grow-1">Ver perfil</a>
            <a href="../contratos/contratacao.html?caregiverId=${c.id}" class="btn btn-elora-outline btn-sm">Contratar</a>
          </div>
        </div>
      </div>
    `).join('');

    let favoriteIds = new Set();
    if(authService.isClient()){
      try{ favoriteIds = await clientService.getFavoriteIds(); }
      catch(err){ console.warn('Não foi possível carregar favoritos:', err.message); }
    }

    el.querySelectorAll('.fav-btn').forEach(btn=>{
      const id = String(btn.dataset.id);
      setFavButtonState(btn, favoriteIds.has(id));
      btn.addEventListener('click', async()=>{
        if(!authService.isAuthenticated()){ window.location.href='../auth/login.html?redirect='+encodeURIComponent('busca/buscar-cuidadores.html'); return; }
        if(!authService.isClient()){ notificationService.showWarning('Entre como cliente para favoritar.'); return; }
        const wasFavorited = btn.classList.contains('is-favorited');
        btn.disabled = true;
        try{
          if(wasFavorited){
            await clientService.removeFavorite(id);
            favoriteIds.delete(id);
            setFavButtonState(btn, false);
            notificationService.showSuccess('Removido dos favoritos.');
          } else {
            await clientService.addFavorite(id);
            favoriteIds.add(id);
            setFavButtonState(btn, true);
            notificationService.showSuccess('Adicionado aos favoritos!');
          }
        }catch(err){ notificationService.showError(err.message); }
        finally{ btn.disabled = false; }
      });
    });
  }
  document.addEventListener('DOMContentLoaded', async () => {
    await loadEspecialidades();
    await syncFromQS();
    doSearch();
  });
</script>
</body>
</html>
