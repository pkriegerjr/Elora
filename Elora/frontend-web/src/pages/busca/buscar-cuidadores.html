<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscar Cuidadores — Elora</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="../../css/style.css" rel="stylesheet">
  <link href="../../css/responsive.css" rel="stylesheet">
</head>
<body>
  <a class="skip-link" href="#main">Pular para o conteúdo</a>
<nav class="navbar navbar-elora sticky-top"><div class="container"><a class="navbar-brand" href="../../../index.html">EL<span>ORA</span></a>
  <div class="ms-auto d-flex align-items-center gap-2">
    <span data-auth-buttons><a href="../auth/login.html" class="btn btn-elora-outline btn-sm">Entrar</a></span>
    <span data-user-menu class="d-none"><span data-user-name class="fw-semibold small"></span> <a href="#" data-action="dashboard" class="btn btn-elora-primary btn-sm" aria-label="Voltar ao painel"><i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Voltar</a> <a href="#" data-action="logout" class="btn btn-outline-danger btn-sm">Sair</a></span>
  </div>
</div></nav>
<div class="container py-4" id="main">
  <div class="row g-4">
    <div class="col-lg-3">
      <div class="filter-sidebar">
        <h5 class="fw-bold">Filtros</h5>
        <div class="mb-3"><label for="fSpecialty" class="form-label small fw-semibold">Especialidade</label><select id="fSpecialty" class="form-select form-select-sm"><option value="">Todas</option></select></div>
        <div class="mb-3"><label for="fRating" class="form-label small fw-semibold">Avaliação mínima</label><select id="fRating" class="form-select form-select-sm"><option value="">Qualquer</option><option value="4.5">4.5+</option><option value="4.0">4.0+</option></select></div>
        <div class="mb-3"><label class="form-label small fw-semibold">Preço máx/h <span class="range-value" id="priceVal">R$ 200</span></label><input type="range" id="fPrice" class="form-range" min="20" max="200" value="200" aria-label="Preço máximo por hora"></div>
        <div class="mb-3"><label class="form-label small fw-semibold">Raio <span class="range-value" id="radiusVal">10 km</span></label><input type="range" id="fRadius" class="form-range" min="1" max="50" value="10" aria-label="Raio de busca em km"></div>
        <div class="mb-3"><label for="fLocation" class="form-label small fw-semibold">Localização</label><input id="fLocation" class="form-control form-control-sm" placeholder="CEP ou lat,lng"><button id="btnLoc" class="btn btn-outline-primary btn-sm w-100 mt-2"><i class="bi bi-geo-fill me-1"></i> Usar minha localização</button></div>
        <div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="fVerified"><label class="form-check-label small" for="fVerified">Só verificados</label></div>
        <button id="btnSearch" class="btn btn-elora-primary w-100"><i class="bi bi-search me-1"></i> Aplicar</button>
        <button id="btnClear" class="btn btn-outline-secondary w-100 mt-2 btn-sm">Limpar</button>
        <div id="resultCount" class="small text-muted mt-3"></div>
      </div>
    </div>
    <div class="col-lg-9">
      <div id="map" class="mb-3" style="min-height:340px" role="application" aria-label="Mapa de cuidadores"></div>
      <div id="caregiverList" class="row g-3"></div>
      <div id="loading" class="text-center py-5 d-none" role="status" aria-live="polite"><div class="spinner-border text-primary"></div><p class="small text-muted mt-2">Buscando cuidadores...</p></div>
      <div id="empty" class="text-center py-5 d-none" role="status" aria-live="polite"><i class="bi bi-inbox fs-1 text-muted"></i><p class="text-muted">Nenhum cuidador encontrado com esses filtros.</p></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../config/config.js"></script>
<script src="../../services/apiService.js"></script>
<script src="../../services/mockData.js"></script>
<script src="../../services/authService.js"></script>
<script src="../../services/notificationService.js"></script>
<script src="../../services/clientService.js"></script>
<script src="../../services/caregiverService.js"></script>
<script src="../../services/contractService.js"></script>
<script src="../../services/paymentService.js"></script>
<script src="../../services/mapsService.js"></script>
<script src="../../services/app.js"></script>
<script>
  const qs = new URLSearchParams(window.location.search);

  // Catálogo vem do backend (GET /busca/especialidades) — nada de slugs fixos.
  async function loadEspecialidades(){
    const sel=document.getElementById('fSpecialty');
    try{
      const lista=await caregiverService.getEspecialidades();
      sel.innerHTML='<option value="">Todas</option>'+lista.map(e=>
        `<option value="${escapeHtml(String(e.id))}" data-nome="${escapeHtml(e.nome)}">${escapeHtml(e.nome)}</option>`
      ).join('');
    }catch(err){
      console.warn('Não foi possível carregar especialidades:', err.message);
    }
  }
  const normTag = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/gi,'').toLowerCase();
  function syncFromQS(){
    const esp=qs.get('specialty');
    if(esp){
      const sel=document.getElementById('fSpecialty');
      const alvo=normTag(esp);
      const opt=[...sel.options].find(o=>normTag(o.value)===alvo
        || normTag(o.dataset.nome)===alvo
        || normTag(o.dataset.nome).includes(alvo)
        || alvo.includes(normTag(o.dataset.nome)));
      if(opt) sel.value=opt.value;
    }
    if(qs.get('minRating')) document.getElementById('fRating').value=qs.get('minRating');
    if(qs.get('radius')) document.getElementById('fRadius').value=qs.get('radius');
    if(qs.get('location')) document.getElementById('fLocation').value=qs.get('location');
    document.getElementById('radiusVal').textContent = document.getElementById('fRadius').value + ' km';
    document.getElementById('priceVal').textContent = 'R$ ' + document.getElementById('fPrice').value;
  }
  document.getElementById('fRadius').addEventListener('input', e=> document.getElementById('radiusVal').textContent=e.target.value+' km');
  document.getElementById('fPrice').addEventListener('input', e=> document.getElementById('priceVal').textContent='R$ '+e.target.value);
  document.getElementById('btnLoc').addEventListener('click', async()=>{
    try{ const loc=await mapsService.getUserLocation(); document.getElementById('fLocation').value=loc.lat.toFixed(5)+','+loc.lng.toFixed(5); doSearch(); }catch(err){ notificationService.showError(err.message); }
  });
  document.getElementById('btnSearch').addEventListener('click', doSearch);
  document.getElementById('btnClear').addEventListener('click', ()=>{ document.getElementById('fSpecialty').value=''; document.getElementById('fRating').value=''; document.getElementById('fPrice').value=200; document.getElementById('fRadius').value=10; document.getElementById('fLocation').value=''; document.getElementById('fVerified').checked=false; doSearch(); });

  async function doSearch(){
    const sel=document.getElementById('fSpecialty');
    const opt=sel.selectedOptions[0];
    const temEsp=opt && opt.value!=='';
    // API filtra por especialidadeId; mock filtra pelo nome da tag.
    const especialidadeId=temEsp && /^\d+$/.test(opt.value) ? Number(opt.value) : undefined;
    const filters={
      specialty: temEsp ? (opt.dataset.nome || opt.textContent) : undefined,
      especialidadeId,
      minRating: parseFloat(document.getElementById('fRating').value) || undefined,
      maxPrice: parseInt(document.getElementById('fPrice').value) || undefined,
      distance: parseInt(document.getElementById('fRadius').value),
      verifiedOnly: document.getElementById('fVerified').checked || undefined,
      userLocation: null
    };
    const locStr=document.getElementById('fLocation').value.trim();
    if(locStr.includes(',')){ const [lat,lng]=locStr.split(',').map(Number); if(!isNaN(lat)) filters.userLocation={lat,lng}; }
    else if(mapsService.userLocation) filters.userLocation=mapsService.userLocation;

    document.getElementById('loading').classList.remove('d-none');
    document.getElementById('caregiverList').innerHTML='';
    document.getElementById('empty').classList.add('d-none');
    try{
      // O service já mapeia o DTO do backend (nome→name, notaMedia→rating, ...)
      // e também aplica os filtros de verificados/distância no cliente.
      const caregivers = await caregiverService.searchCaregivers(filters);
      renderList(caregivers);
      // mapa
      await mapsService.initializeMap({ containerId:'map' });
      if(caregivers.length) mapsService.createCaregiverMarkers(caregivers);
      document.getElementById('resultCount').textContent = caregivers.length + ' cuidador(es) encontrado(s)';
    }catch(err){ notificationService.showError(err.message); }
    finally{ document.getElementById('loading').classList.add('d-none'); }
  }

  function renderList(list){
    const el=document.getElementById('caregiverList');
    if(!list.length){ document.getElementById('empty').classList.remove('d-none'); return; }
    el.innerHTML = list.map(c=>`
      <div class="col-md-6">
        <div class="card-elora caregiver-card p-3 h-100">
          <div class="d-flex gap-3">
            <div class="avatar-placeholder"><i class="bi bi-person"></i></div>
            <div class="flex-grow-1">
              <div class="d-flex align-items-center gap-2"><strong>${escapeHtml(c.name)}</strong> ${c.verified?'<span class="verified small"><i class="bi bi-patch-check-fill"></i> Verificado</span>':''}</div>
              <div class="small text-muted">${escapeHtml((c.specialties||[]).slice(0,3).join(' • '))}</div>
              <div class="small"><span class="stars">${'★'.repeat(Math.floor(c.rating||0))}${'☆'.repeat(5-Math.floor(c.rating||0))}</span> ${(c.rating||0).toFixed(1)} (${c.reviewCount||0}) ${c.distance? '• '+c.distance+' km':''}</div>
              <div class="small text-muted">${(c.address?.neighborhood||c.address?.city)?`<i class="bi bi-geo-alt me-1"></i>${escapeHtml(c.address.neighborhood||c.address.city)} • `:''}R$ ${Number(c.hourlyRate||0).toFixed(2)}/h</div>
            </div>
            <button class="btn btn-outline-primary btn-sm align-self-start fav-btn" data-id="${c.id}" title="Favoritar" aria-label="Favoritar cuidador"><i class="bi bi-heart"></i></button>
          </div>
          <p class="small text-muted mt-2 mb-2" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${escapeHtml(c.bio||'')}</p>
          <div class="d-flex gap-2">
            <a href="../busca/perfil-cuidador.html?id=${c.id}" class="btn btn-elora-primary btn-sm flex-grow-1">Ver perfil</a>
            <a href="../contratos/contratacao.html?caregiverId=${c.id}" class="btn btn-elora-outline btn-sm">Contratar</a>
          </div>
        </div>
      </div>
    `).join('');
    el.querySelectorAll('.fav-btn').forEach(btn=> btn.addEventListener('click', async()=>{
      if(!authService.isAuthenticated()){ window.location.href='../auth/login.html?redirect='+encodeURIComponent('busca/buscar-cuidadores.html'); return; }
      try{ await clientService.addFavorite(btn.dataset.id); notificationService.showSuccess('Adicionado aos favoritos!'); btn.innerHTML='<i class="bi bi-heart-fill text-danger"></i>'; }catch(err){ notificationService.showError(err.message); }
    }));
  }
  document.addEventListener('DOMContentLoaded', async () => {
    await loadEspecialidades();
    syncFromQS();
    doSearch();
  });
</script>
</body>
</html>
