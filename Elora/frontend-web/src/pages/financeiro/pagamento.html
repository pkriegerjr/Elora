<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento — Elora</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="../../css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-elora"><div class="container"><a class="navbar-brand" href="../../../index.html">EL<span>ORA</span></a><a href="#" data-action="dashboard" class="btn btn-elora-outline btn-sm">Meu painel</a></div></nav>
<div class="container py-5">
  <div class="row justify-content-center"><div class="col-lg-7">
    <div class="card-elora p-4 p-md-5" id="root">
      <div class="text-center py-4"><div class="spinner-border"></div></div>
    </div>
  </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../config/config.js"></script>
<script src="../../services/apiService.js"></script>
<script src="../../services/mockData.js"></script>
<script src="../../services/authService.js"></script>
<script src="../../services/notificationService.js"></script>
<script src="../../services/clientService.js"></script>
<script src="../../services/caregiverService.js"></script>
<script src="../../services/contractService.js"></script>
<script src="../../services/paymentService.js"></script>
<script src="../../services/mapsService.js"></script>
<script src="../../services/app.js"></script>
<script>
  const contractId = new URLSearchParams(window.location.search).get('contractId');
  const paymentIdParam = new URLSearchParams(window.location.search).get('paymentId');
  let contract, payment;

  async function init(){
    const root=document.getElementById('root');
    if(!authService.isAuthenticated()){ window.location.href='login.html?redirect=pagamento.html?contractId='+contractId; return; }
    if(!contractId && !paymentIdParam){ root.innerHTML='<div class="alert alert-warning">Contrato não informado</div>'; return; }
    try{
      if(contractId) contract = await contractService.getContract(contractId);
      let existingPayments = await paymentService.getUserPayments();
      payment = paymentIdParam ? existingPayments.find(p=>p.id===paymentIdParam) : existingPayments.find(p=>p.contractId===contractId);
      if(!payment && contract){
        // cria pagamento pendente
        const total = contract.valueBreakdown?.total || contract.totalValue?.total || 0;
        payment = await paymentService.createPayment({ contractId: contract.id, clientId: contract.clientId, caregiverId: contract.caregiverId, amount: total, method: contract.paymentMethod || 'PIX' });
      }
      render();
    }catch(err){ root.innerHTML='<div class="alert alert-danger">'+err.message+'</div>'; }
  }

  function render(){
    const root=document.getElementById('root');
    const statusLabel = payment.statusLabel || payment.status;
    root.innerHTML=`
      <h3 class="section-title">Pagamento</h3>
      <p class="small text-muted">Contrato ${payment.contractId} • Status: <span class="badge ${payment.status==='APPROVED'?'bg-success': payment.status==='PENDING'?'bg-warning text-dark':'bg-secondary'}">${statusLabel}</span></p>
      <div class="bg-light p-3 rounded mb-3">
        <div class="d-flex justify-content-between"><span>Valor</span><strong>${formatCurrency(payment.amount)}</strong></div>
        <div class="d-flex justify-content-between small text-muted"><span>Método</span><span>${payment.method||payment.methodLabel||''}</span></div>
        ${payment.transactionId? '<div class="small text-muted">Transação: '+payment.transactionId+'</div>':''}
      </div>
      ${payment.status==='PENDING'? `
        <ul class="nav nav-pills mb-3" id="payTabs" role="tablist">
          <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#pix">PIX</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#card">Cartão</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#boleto">Boleto</button></li>
        </ul>
        <div class="tab-content border rounded p-3">
          <div class="tab-pane fade show active" id="pix">
            <p class="small text-muted">QR Code PIX (mock) — expira em 30 min</p>
            <div class="text-center"><div class="bg-white border p-3 d-inline-block"><i class="bi bi-qr-code" style="font-size:5rem"></i></div><p class="small mt-2 font-monospace" id="pixCode"></p></div>
            <button id="btnPayPix" class="btn btn-elora-primary w-100 mt-2">Confirmar pagamento PIX</button>
          </div>
          <div class="tab-pane fade" id="card">
            <div class="alert alert-warning small">Em produção o cartão é tokenizado no gateway. Aqui é simulação.</div>
            <div class="mb-3"><label class="form-label">Token do cartão (mock)</label><input id="cardToken" class="form-control" placeholder="tok_123"></div>
            <div class="mb-3"><label class="form-label">Parcelas</label><select id="installments" class="form-select"><option value="1">1x</option><option value="3">3x</option><option value="6">6x</option></select></div>
            <button id="btnPayCard" class="btn btn-elora-primary w-100">Pagar com cartão</button>
          </div>
          <div class="tab-pane fade" id="boleto">
            <p class="small" id="boletoCode"></p>
            <button id="btnPayBoleto" class="btn btn-elora-primary w-100">Gerar boleto</button>
          </div>
        </div>
        <button id="btnCancelPay" class="btn btn-outline-danger w-100 mt-3 btn-sm">Cancelar pagamento</button>
      ` : payment.status==='APPROVED'? '<div class="alert alert-success"><i class="bi bi-check-circle me-1"></i> Pagamento aprovado! Comprovante disponível no painel.</div><a href="../contratos/contrato.html?id='+payment.contractId+'" class="btn btn-elora-outline w-100">Ver contrato</a>' : '<div class="alert alert-secondary">Status: '+statusLabel+'</div>'}
    `;
    if(payment.status==='PENDING'){
      paymentService.generatePixQrCode(payment.id).then(d=> document.getElementById('pixCode').textContent=d.copiaEcola.slice(0,80)+'...').catch(()=>{});
      paymentService.generateBoleto(payment.id).then(d=> document.getElementById('boletoCode').textContent='Linha digitável: '+d.linhaDigitavel).catch(()=>{});
      document.getElementById('btnPayPix')?.addEventListener('click', async()=> doPay({method:'PIX'}));
      document.getElementById('btnPayCard')?.addEventListener('click', async()=> {
        const token=document.getElementById('cardToken').value.trim()||'tok_mock';
        await doPay({method:'CARD', token, installments: parseInt(document.getElementById('installments').value)});
      });
      document.getElementById('btnPayBoleto')?.addEventListener('click', async()=> doPay({method:'BOLETO'}));
      document.getElementById('btnCancelPay')?.addEventListener('click', async()=>{
        const r=prompt('Motivo?'); if(!r) return; try{ await paymentService.cancelPayment(payment.id, r); notificationService.showWarning('Pagamento cancelado'); setTimeout(()=> location.reload(),700);}catch(err){ notificationService.showError(err.message); }
      });
    }
  }
  async function doPay(details){
    try{ const updated = await paymentService.processPayment(payment.id, details); notificationService.showSuccess('Pagamento '+updated.statusLabel); setTimeout(()=> location.reload(), 700); }catch(err){ notificationService.showError(err.message); }
  }
  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
