<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Perfil — Elora</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-elora"><div class="container"><a class="navbar-brand" href="../../../index.html">EL<span>ORA</span></a><a href="#" data-action="dashboard" class="btn btn-elora-outline btn-sm">Painel</a></div></nav>
<div class="container py-4" id="perfilRoot">
  <div class="text-center py-5"><div class="spinner-border"></div><p class="small text-muted">Carregando perfil...</p></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../config/config.js"></script>
<script src="../../services/apiService.js"></script>
<script src="../../services/mockData.js"></script>
<script src="../../services/authService.js"></script>
<script src="../../services/notificationService.js"></script>
<script src="../../services/clientService.js"></script>
<script src="../../services/caregiverService.js"></script>
<script src="../../services/contractService.js"></script>
<script src="../../services/paymentService.js"></script>
<script src="../../services/mapsService.js"></script>
<script src="../../services/app.js"></script>
<script>
  async function load(){
    const root=document.getElementById('perfilRoot');
    if(!authService.isAuthenticated()){
      window.location.href=authService.getLoginUrl('perfil/perfil.html');
      return;
    }
    try{
      let user;
      if(!CONFIG.API.MOCK_MODE){
        user = await authService.getMe();
      } else {
        user = authService.getCurrentUser();
      }
      const perfis = (user.perfis||[]).join(', ') || user.type || '-';
      root.innerHTML=`
        <div class="row justify-content-center"><div class="col-lg-7">
          <div class="card-elora p-4">
            <div class="d-flex gap-3 align-items-center mb-3">
              <div class="avatar-placeholder lg"><i class="bi bi-person"></i></div>
              <div>
                <h4 class="mb-1">${user.nome||user.name}</h4>
                <div class="small text-muted">${user.email} • CPF ${user.cpfDigits||user.cpf||''}</div>
                <div><span class="badge bg-primary">${perfis}</span> <span class="badge ${user.status==='ativo'?'bg-success':'bg-warning text-dark'}">${user.status||''}</span></div>
              </div>
            </div>
            <hr>
            <dl class="row small">
              <dt class="col-sm-4">ID</dt><dd class="col-sm-8">${user.id}</dd>
              <dt class="col-sm-4">Telefone</dt><dd class="col-sm-8">${user.telefone||user.phone||'-'}</dd>
              <dt class="col-sm-4">Gênero</dt><dd class="col-sm-8">${user.genero||'-'}</dd>
              <dt class="col-sm-4">Nascimento</dt><dd class="col-sm-8">${user.dataNascimento||user.birthDate||'-'}</dd>
              <dt class="col-sm-4">Preço/hora</dt><dd class="col-sm-8">${user.precoHora? formatCurrency(user.precoHora):'-'}</dd>
              <dt class="col-sm-4">Nota média</dt><dd class="col-sm-8">${user.notaMedia||'-'}</dd>
            </dl>
            <div class="d-flex gap-2">
              <a href="#" data-action="dashboard" class="btn btn-elora-primary">Ir ao painel</a>
              <button id="btnLogout" class="btn btn-outline-danger">Sair</button>
            </div>
            <div class="alert alert-info small mt-3">Base: ${CONFIG.API.baseURL} — MOCK_MODE=${CONFIG.API.MOCK_MODE}<br>Tipo detectado via <code>perfis[]</code> (Back diz que tipo vem do banco, não do formulário).</div>
          </div>
        </div></div>
      `;
      document.getElementById('btnLogout')?.addEventListener('click', ()=>{ authService.logout(); window.location.href='../auth/login.html'; });
    }catch(err){
      root.innerHTML='<div class="alert alert-danger">'+err.message+'</div>';
    }
  }
  document.addEventListener('DOMContentLoaded', load);
</script>
</body>
</html>
