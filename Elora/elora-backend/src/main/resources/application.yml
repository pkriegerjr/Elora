server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: elora-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/elora}
    username: ${DB_USERNAME:elora}
    password: ${DB_PASSWORD:elora123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc.lob.non_contextual_creation: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

# ELORA - Configurações de negócio
elora:
  jwt:
    secret: ${JWT_SECRET:change_me_super_secret_256_bits_key_for_elora_jwt_please_change_in_prod}
    expiration-ms: 3600000 # 1h
    refresh-expiration-ms: 86400000 # 24h
  security:
    aes-key: ${AES_KEY:0123456789ABCDEF0123456789ABCDEF}
    mfa-enabled: true
    rbac-enabled: true
  financeiro:
    taxa-plataforma-percentual: 15.0
    repasse-percentual: 85.0
  storage:
    s3:
      bucket: ${AWS_S3_BUCKET:elora-storage}
      region: ${AWS_REGION:us-east-1}
  firebase:
    enabled: false
  maps:
    google-api-key: ${GOOGLE_MAPS_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.elora: DEBUG
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
logging:
  level:
    com.elora: INFO
