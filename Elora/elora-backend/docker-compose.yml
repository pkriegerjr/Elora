version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: elora
      POSTGRES_USER: elora
      POSTGRES_PASSWORD: elora123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/elora
      DB_USERNAME: elora
      DB_PASSWORD: elora123
      REDIS_HOST: redis
      JWT_SECRET: change_me_super_secret_256_bits_key_for_elora_jwt_please_change_in_prod
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
