apiVersion: apps/v1
kind: Deployment
metadata:
  name: elora-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: elora-backend
  template:
    metadata:
      labels:
        app: elora-backend
    spec:
      containers:
      - name: elora
        image: elora-backend:3.0.0
        ports:
        - containerPort: 8080
        env:
        - name: DB_URL
          value: jdbc:postgresql://postgres-service:5432/elora
        - name: REDIS_HOST
          value: redis-cluster
        readinessProbe:
          httpGet:
            path: /api/actuator/health
            port: 8080
          initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: elora-service
spec:
  selector:
    app: elora-backend
  ports:
  - port: 80
    targetPort: 8080
  type: LoadBalancer
