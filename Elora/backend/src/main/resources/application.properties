# Elora - application.properties (Spring Boot 3.2 + MySQL 8 - elora_schema_v2.sql)
server.port=8080
server.servlet.context-path=/api

# PostgreSQL (Neon) - o schema esta em backend/database/postgres/elora_schema_v2_pg.sql
# Producao: defina DB_HOST/DB_NAME/DB_USERNAME/DB_PASSWORD/JWT_SECRET no ambiente.
# Exemplo Neon: DB_HOST=ep-xxx.us-east-2.aws.neon.tech DB_NAME=neondb
# (use a connection string DIRETA, nao a do pooler, para o JDBC).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:elora_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA - schema gerenciado pelo SQL versionado (validate); em prod use validate + Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Jackson
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss'Z'

# Security - OBRIGATÓRIO em produção: exporte JWT_SECRET com no mínimo
# 32 caracteres (gere com: openssl rand -base64 48). Em dev local pode usar
# o `.env` (veja `backend/.env.example`) ou `application-local.properties`
# (ignorado pelo git). Existe um fallback em JwtService só para dev.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:2592000000}

# OpenAPI (Swagger UI em /api/swagger-ui.html por causa do context-path)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logs
logging.level.com.elora=DEBUG
logging.level.org.hibernate.SQL=DEBUG
