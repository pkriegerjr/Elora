# Elora - application.properties (Spring Boot 3.2 + MySQL 8 - elora_schema_v2.sql)
server.port=8080
server.servlet.context-path=/api

# MySQL - ajuste para seu Codespace/Docker
# (sem characterEncoding: o valor 'utf8mb4' não é um charset Java válido e o
# driver rejeita a conexão; o MySQL já negocia utf8mb4 via collation do banco)
# Credenciais via ambiente (desenvolvimento usa os defaults; produção SEMPRE
# define DB_USERNAME/DB_PASSWORD/JWT_SECRET — nunca commitar valores reais).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:elora_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA - V2 usa create apenas se banco vazio; em prod use validate + Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Jackson
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss'Z'

# Security - OBRIGATÓRIO em produção: exporte JWT_SECRET com no mínimo
# 32 caracteres (gere com: openssl rand -base64 48). Em dev local pode usar
# o `.env` (veja `backend/.env.example`) ou `application-local.properties`
# (ignorado pelo git). Existe um fallback em JwtService só para dev.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:2592000000}

# OpenAPI (Swagger UI em /api/swagger-ui.html por causa do context-path)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logs
logging.level.com.elora=DEBUG
logging.level.org.hibernate.SQL=DEBUG
