# Elora - application.properties (Spring Boot 3.2 + MySQL 8 - elora_schema_v2.sql)
server.port=8080
server.servlet.context-path=/api

# MySQL - ajuste para seu Codespace/Docker
spring.datasource.url=jdbc:mysql://localhost:3306/elora_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8mb4
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA - V2 usa create apenas se banco vazio; em prod use validate + Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Jackson
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss'Z'

# Security - defina no Codespace Secrets / .env
# app.jwt.secret=CHANGE_ME_32_CHARS_MIN
# app.jwt.expiration=86400000

# Logs
logging.level.com.elora=DEBUG
logging.level.org.hibernate.SQL=DEBUG
