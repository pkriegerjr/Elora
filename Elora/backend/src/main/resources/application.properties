# Elora - application.properties (Spring Boot 3.2 + PostgreSQL Neon - database/postgres/elora_schema_v2_pg.sql)
spring.config.import=optional:file:.env[.properties]

server.port=8080
server.servlet.context-path=/api

# PostgreSQL (Neon) - o schema esta em backend/database/postgres/elora_schema_v2_pg.sql
# Producao: defina DB_HOST/DB_NAME/DB_USERNAME/DB_PASSWORD/JWT_SECRET no ambiente.
# Exemplo Neon: DB_HOST=ep-xxx.us-east-2.aws.neon.tech DB_NAME=neondb
# (use a connection string DIRETA, nao a do pooler, para o JDBC).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:elora_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA - schema gerenciado pelo SQL versionado (validate); em prod use validate + Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# explicito para nao gerar aviso; a API e so JWT (nao ha usuario Spring Security)
spring.jpa.open-in-view=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Jackson
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss'Z'

# Security - OBRIGATÓRIO em produção: exporte JWT_SECRET com no mínimo
# 32 caracteres (gere com: openssl rand -base64 48). Em dev local pode usar
# o `.env` (veja `backend/.env.example`) ou `application-local.properties`
# (ignorado pelo git). Existe um fallback em JwtService só para dev.
app.jwt.secret=${JWT_SECRET:dev-local-secret-0123456789abcdef-0123456789abcdef}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:2592000000}

# OpenAPI (Swagger UI em /api/swagger-ui.html por causa do context-path)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logs
logging.level.com.elora=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# --- Pagamento: mock (default) | asaas -------------------------------
app.integracoes.pagamento.provider=${PAGAMENTO_PROVIDER:mock}
app.integracoes.pagamento.asaas.base-url=${ASAAS_BASE_URL:https://sandbox.asaas.com/api/v3}
app.integracoes.pagamento.asaas.api-key=${ASAAS_API_KEY:}
app.integracoes.pagamento.asaas.webhook-token=${ASAAS_WEBHOOK_TOKEN:}
app.integracoes.pagamento.asaas.timeout-ms=${ASAAS_TIMEOUT_MS:10000}

# --- Storage de documentos: local (default) | s3 ---------------------
app.integracoes.storage.provider=${STORAGE_PROVIDER:local}
app.integracoes.storage.local.dir=${STORAGE_LOCAL_DIR:./uploads}
app.integracoes.storage.max-bytes=${STORAGE_MAX_BYTES:5242880}
app.integracoes.storage.s3.bucket=${S3_BUCKET:}
app.integracoes.storage.s3.region=${S3_REGION:us-east-1}
app.integracoes.storage.s3.endpoint=${S3_ENDPOINT:}
app.integracoes.storage.s3.access-key=${S3_ACCESS_KEY:}
app.integracoes.storage.s3.secret-key=${S3_SECRET_KEY:}
app.integracoes.storage.s3.path-style=${S3_PATH_STYLE:true}

# --- E-mail transacional (SMTP) --------------------------------------
app.integracoes.email.enabled=${EMAIL_ENABLED:false}
app.integracoes.email.remetente=${EMAIL_REMETENTE:nao-responda@elora.local}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}

app.webapp.base-url=${WEBAPP_BASE_URL:http://localhost:8000}

# --- Google Maps (GET /config/maps-key) ------------------------------
app.integracoes.maps.api-key=${GOOGLE_MAPS_API_KEY:}

# --- Upload multipart ------------------------------------------------
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:12MB}

# --- Actuator --------------------------------------------------------
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,info}
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:never}
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,info}
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:never}
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}

# Storage: grava em target/, limpo pelo `mvn clean`
app.integracoes.storage.provider=local
app.integracoes.storage.local.dir=target/test-uploadsspring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}
