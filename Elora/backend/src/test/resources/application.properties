# Testes: H2 em memória (não exige MySQL local). Produção continua MySQL + validate.
spring.datasource.url=jdbc:h2:mem:eloratest;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Storage: grava em target/, limpo pelo `mvn clean`
app.integracoes.storage.provider=local
app.integracoes.storage.local.dir=target/test-uploads
