version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: elora_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: elora_db
      MYSQL_USER: elora
      MYSQL_PASSWORD: elora123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/elora_schema_v2.sql:/docker-entrypoint-initdb.d/01-schema.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: elora_redis
    ports:
      - "6379:6379"

volumes:
  mysql_data:
